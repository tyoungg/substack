<!DOCTYPE html>
<html>
<head>
  <meta charset='utf-8' />
  <title>substack-charts — Weekly images</title>
  <meta name='viewport' content='width=device-width,initial-scale=1' />
  <style>
    body { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; margin: 24px; background:#f7f7f7; color:#111 }
    h1 { margin-bottom: 8px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill,minmax(240px,1fr)); gap: 12px; }
    .card { border: 1px solid #e6e6e6; padding: 8px; border-radius: 6px; background:#fff; box-shadow:0 1px 2px rgba(0,0,0,0.03); }
    .card img { max-width: 100%; height: auto; display:block; margin: 0 auto; }
    .fname { font-size: 12px; color:#444; margin-top:6px; word-break:break-word; text-align:center; }
    .notice { color:#666; font-size:14px; margin-bottom:12px; }
    a.repo { font-size:13px }
    a { text-decoration: none; color: inherit; }
  </style>
</head>
<body>
  <h1>substack-charts — Weekly images</h1>
  <div class='notice'>This is a static gallery that embeds the images stored in the charts/ folder of this repository.</div>
  <div class='grid'>
    <div class="card">
      <a href="https://raw.githubusercontent.com/tyoungg/substack/main/charts/KR_weekly_patterns.png" target="_blank"><img src="https://raw.githubusercontent.com/tyoungg/substack/main/charts/KR_weekly_patterns.png" alt="KR_weekly_patterns.png"></a>
      <div class="fname">KR_weekly_patterns.png</div>
    </div>
  </div>
  <p style='margin-top:20px;font-size:13px'>Repo: <a class='repo' href='https://github.com/tyoungg/substack'>tyoungg/substack</a></p>
</body>
</html>
